# Hybrid: NEAT architecture search for 300 generations, then CMA-ES on the
# weights of the best NEAT topology. Curriculum continues across the switch.
method: neat_cma
method_cfg:
  switch_generation: 300
  neat:
    pop_size: 1200
    species_target: 100
  cmaes:
    popsize: 64
    sigma0: 0.2
budget:            # equal training-sample budget for every method
  generations: null
  env_steps: 5000000000
  wall_hours: 4
