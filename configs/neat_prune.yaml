# Variant of neat.yaml with explicit pressure toward small topologies: a connection-deletion
# mutation (5 % of children) and a size penalty on deployable parameters only.
method: neat
method_cfg:
  pop_size: 1200
  species_target: 100
  delete_conn_rate: 0.05
  size_measure: effective
budget:            # equal training-sample budget for every method
  generations: null
  env_steps: 5000000000
  wall_hours: 4
