# Stage 2 of the encoder study (docs/ENCODER_SENSING.md).
# Launch: push a tag enc-<set>-<anything> (e.g. enc-smoke-1), dispatch with a set name, or (when
# tag pushes are not allowed, as in the cloud sessions) push a commit to the research branch that
# changes experiments/encoder_launch.txt, whose first word is the set name. Cells come from experiments/encoder_stage2.json[<set>]. One job per cell runs its seeds in
# parallel (one process per core) and uploads runs/encoder as an artifact.
name: encoder
on:
  push:
    tags: ['enc-*']
    branches: ['claude/quantized-encoder-swing-up-r876l1']
    paths: ['experiments/encoder_launch.txt']      # not evaluated for tag pushes
  workflow_dispatch:
    inputs:
      set:
        description: cell set in experiments/encoder_stage2.json
        required: true
        default: smoke

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then SET="${{ github.event.inputs.set }}";
          elif [ "${{ github.ref_type }}" = "tag" ]; then SET=$(echo "${GITHUB_REF_NAME}" | cut -d- -f2);
          else SET=$(head -n1 experiments/encoder_launch.txt | cut -d' ' -f1); fi
          echo "set=$SET"
          python3 -c "import json,sys; c=json.load(open('experiments/encoder_stage2.json'))['$SET']; print('matrix='+json.dumps({'include':c['cells']}))" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install numpy numba cma pyyaml drake
      - name: stage-1 shards (cells with a cmd)
        if: matrix.cmd
        run: |
          mkdir -p runs/encoder
          ${{ matrix.cmd }}
          wc -l runs/encoder/*.jsonl
      - name: train (seeds in parallel)
        if: ${{ !matrix.cmd }}
        run: |
          mkdir -p runs/encoder
          n=0
          for s in ${{ matrix.seeds }}; do
            python experiments/encoder_curriculum.py ${{ matrix.args }} --seed $s --budget ${{ matrix.budget }} --out runs/encoder > runs/encoder/stdout_s$s.txt 2>&1 &
            n=$((n+1))
          done
          wait
          tail -n 3 runs/encoder/*.txt
          test "$(ls runs/encoder/*.json | wc -l)" -eq "$n"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enc-${{ matrix.name }}
          path: runs/encoder/
