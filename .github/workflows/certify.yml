# Certified balance region (experiments/certify_balance.py), sharded over the initial boxes.
#
#   git tag cert-smoke-N && git push origin cert-smoke-N   -> smoke test (small level, 2 shards)
#   git tag cert-<label>  && git push origin cert-<label>   -> job described in results/certify/job.json
#   a push to a certify branch that changes results/certify/job.json -> that job ("smoke": true
#     gives the smoke test); used from agent sessions, which cannot push tags
#   or "Run workflow" (workflow_dispatch) with explicit inputs.
#
# Artifacts: one JSON per shard, and certificate.json + sanity.json from the combine job.
name: certify

on:
  push:
    tags: ["cert-*"]
    branches: ["claude/certify-*", "research/certify-*"]
    paths: ["results/certify/job.json"]
  workflow_dispatch:
    inputs:
      name:
        description: "controller (mlp45, mlp45_int8, mlp45_int6, mlp45_pruned, lqr)"
        default: "mlp45"
      rho0:
        description: "starting level (blank: the setup's sampled upper bound)"
        default: ""
      shards:
        description: "number of shards"
        default: "10"
      sanity_n:
        description: "samples for the 60 s simulation check"
        default: "1000000"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.p.outputs.name }}
      rho0: ${{ steps.p.outputs.rho0 }}
      shards: ${{ steps.p.outputs.shards }}
      matrix: ${{ steps.p.outputs.matrix }}
      sanity_n: ${{ steps.p.outputs.sanity_n }}
      grid: ${{ steps.p.outputs.grid }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        shell: python
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          IN_NAME: ${{ inputs.name }}
          IN_RHO0: ${{ inputs.rho0 }}
          IN_SHARDS: ${{ inputs.shards }}
          IN_SANITY: ${{ inputs.sanity_n }}
        run: |
          import json, os
          e = os.environ
          if e["EVENT"] == "workflow_dispatch":
              job = {"name": e["IN_NAME"], "rho0": e["IN_RHO0"], "shards": int(e["IN_SHARDS"]),
                     "sanity_n": int(e["IN_SANITY"]), "grid": 4}
          else:
              job = json.load(open("results/certify/job.json"))
              if e["REF"].startswith("cert-smoke") or job.get("smoke"):
                  job = {"name": job.get("name", "mlp45"), "rho0": 0.05, "shards": 2,
                         "sanity_n": 10000, "grid": 2}
          if job.get("rho0") in ("", None):
              job["rho0"] = json.load(open(f"results/certify/{job['name']}/setup.json"))["rho_sampled_upper"]
          n = int(job["shards"])
          with open(e["GITHUB_OUTPUT"], "a") as f:
              f.write(f"name={job['name']}\nrho0={job['rho0']}\nshards={n}\n")
              f.write(f"sanity_n={job.get('sanity_n', 1000000)}\ngrid={job.get('grid', 4)}\n")
              f.write("matrix=" + json.dumps(list(range(n))) + "\n")
          print(job)

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy numba scipy pyyaml
      - name: branch and bound
        run: |
          nproc
          python experiments/certify_balance.py run ${{ needs.plan.outputs.name }} \
            --rho0 ${{ needs.plan.outputs.rho0 }} --grid ${{ needs.plan.outputs.grid }} \
            --shard ${{ matrix.shard }} ${{ needs.plan.outputs.shards }} \
            --out out/shard_${{ matrix.shard }}.json
          cat out/shard_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: cert-${{ needs.plan.outputs.name }}-shard-${{ matrix.shard }}
          path: out/

  combine:
    needs: [plan, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy numba scipy pyyaml
      - uses: actions/download-artifact@v4
        with:
          pattern: cert-${{ needs.plan.outputs.name }}-shard-*
          merge-multiple: true
          path: shards/
      - name: combine
        run: |
          for f in shards/*.json; do echo "== $f"; cat $f; done
          python experiments/certify_balance.py combine ${{ needs.plan.outputs.name }} shards/*.json
      - name: sanity (simulate samples of the certified set for 60 s)
        run: |
          python experiments/certify_balance.py sanity ${{ needs.plan.outputs.name }} \
            --n ${{ needs.plan.outputs.sanity_n }} --seconds 60 --out results/certify/${{ needs.plan.outputs.name }}/sanity.json
          cat results/certify/${{ needs.plan.outputs.name }}/sanity.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cert-${{ needs.plan.outputs.name }}-result
          path: |
            results/certify/${{ needs.plan.outputs.name }}/certificate.json
            results/certify/${{ needs.plan.outputs.name }}/sanity.json
            shards/
