# Certified balance region (experiments/certify_balance.py), sharded over the initial boxes.
#
#   git tag cert-smoke-N && git push origin cert-smoke-N   -> smoke test (small level, 2 shards)
#   git tag cert-<label>  && git push origin cert-<label>   -> job described in results/certify/job.json
#   a push to a certify branch that changes results/certify/job.json -> that job ("smoke": true
#     gives the smoke test); used from agent sessions, which cannot push tags
#   or "Run workflow" (workflow_dispatch) with explicit inputs.
#
# Artifacts: one JSON per shard, and certificate.json + sanity.json from the combine job.
name: certify

on:
  push:
    tags: ["cert-*"]
    branches: ["claude/certify-*", "research/certify-*"]
    paths: ["results/certify/job.json"]
  workflow_dispatch:
    inputs:
      name:
        description: "controller (mlp45, mlp45_int8, mlp45_int6, mlp45_pruned, lqr)"
        default: "mlp45"
      rho0:
        description: "starting level (blank: the setup's sampled upper bound)"
        default: ""
      shards:
        description: "number of shards"
        default: "10"
      sanity_n:
        description: "samples for the 60 s simulation check"
        default: "1000000"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      names: ${{ steps.p.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        shell: python
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          IN_NAME: ${{ inputs.name }}
          IN_RHO0: ${{ inputs.rho0 }}
          IN_SHARDS: ${{ inputs.shards }}
          IN_SANITY: ${{ inputs.sanity_n }}
        run: |
          # job.json: one job {"name", "rho0", "shards", "grid", "minw", "sanity_n", "smoke"} or
          # {"jobs": [job, ...]}; rho0 "" = the setup's sampled upper bound.
          import json, os
          e = os.environ
          if e["EVENT"] == "workflow_dispatch":
              jobs = [{"name": e["IN_NAME"], "rho0": e["IN_RHO0"], "shards": int(e["IN_SHARDS"]),
                       "sanity_n": int(e["IN_SANITY"])}]
          else:
              d = json.load(open("results/certify/job.json"))
              jobs = d["jobs"] if "jobs" in d else [d]
              if e["REF"].startswith("cert-smoke") or d.get("smoke"):
                  jobs = [{"name": "mlp45", "rho0": 0.05, "shards": 2, "sanity_n": 10000, "grid": 2}]
          shards, names = [], []
          for j in jobs:
              rho0 = j.get("rho0")
              if rho0 in ("", None):
                  rho0 = json.load(open(f"results/certify/{j['name']}/setup.json"))["rho_sampled_upper"]
              n = int(j.get("shards", 10))
              for i in range(n):
                  shards.append({"name": j["name"], "shard": i, "n": n, "rho0": rho0,
                                 "grid": j.get("grid", 4), "minw": j.get("minw", 0.01)})
              names.append({"name": j["name"], "sanity_n": j.get("sanity_n", 1000000)})
          with open(e["GITHUB_OUTPUT"], "a") as f:
              f.write("shards=" + json.dumps(shards) + "\n")
              f.write("names=" + json.dumps(names) + "\n")
          print(json.dumps(jobs, indent=1))

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy numba scipy pyyaml
      - name: branch and bound
        run: |
          nproc
          python experiments/certify_balance.py run ${{ matrix.name }} \
            --rho0 ${{ matrix.rho0 }} --grid ${{ matrix.grid }} --minw ${{ matrix.minw }} \
            --shard ${{ matrix.shard }} ${{ matrix.n }} --out out/shard_${{ matrix.shard }}.json
          cat out/shard_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: cert-${{ matrix.name }}-shard-${{ matrix.shard }}
          path: out/

  combine:
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy numba scipy pyyaml
      - uses: actions/download-artifact@v4
        with:
          pattern: cert-${{ matrix.name }}-shard-*
          merge-multiple: true
          path: shards/
      - name: combine
        run: |
          for f in shards/*.json; do echo "== $f"; cat $f; done
          python experiments/certify_balance.py combine ${{ matrix.name }} shards/*.json
      - name: sanity (simulate samples of the certified set for 60 s)
        run: |
          python experiments/certify_balance.py sanity ${{ matrix.name }} \
            --n ${{ matrix.sanity_n }} --seconds 60 --out results/certify/${{ matrix.name }}/sanity.json
          cat results/certify/${{ matrix.name }}/sanity.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cert-${{ matrix.name }}-result
          path: |
            results/certify/${{ matrix.name }}/certificate.json
            results/certify/${{ matrix.name }}/sanity.json
            shards/
